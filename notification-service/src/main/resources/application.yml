server:
  port: 8084

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://localhost:3306/mandi_notifications?allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        type.preferred_uuid_jdbc_type: CHAR
        type.preferred_instant_jdbc_type: TIMESTAMP

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025          # Mailpit; read the emails at http://localhost:8025
    properties:
      "[mail.smtp.connectiontimeout]": 3000
      "[mail.smtp.timeout]": 3000

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.trusted.packages]": "com.mandiflow.events"

mandiflow:
  mail:
    from: orders@mandiflow.test

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mandiflow: DEBUG
    org.apache.kafka: WARN
