server:
  port: 8083

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/mandi_payments?allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        type.preferred_uuid_jdbc_type: CHAR
        type.preferred_instant_jdbc_type: TIMESTAMP

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.trusted.packages]": "com.mandiflow.events"

mandiflow:
  outbox:
    poll-interval-ms: 500
  payment:
    decline-above: 2000     # the fake gateway declines any order over ₹2,000

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mandiflow: DEBUG
    org.apache.kafka: WARN
